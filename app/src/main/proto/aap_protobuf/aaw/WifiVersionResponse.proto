syntax="proto2";

import "aap_protobuf/aaw/Status.proto";

package aap_protobuf.aaw;

// The phone's answer to WifiVersionRequest (field names from aa-proxy-rs' decoder).
message WifiVersionResponse {
  required uint32 major_version = 1;
  required uint32 minor_version = 2;
  optional string device_serial = 3;
  required Status status = 4;
}
