syntax="proto2";

package aap_protobuf.aaw;

// The WiFi security in the Bluetooth bootstrap's WifiInfoResponse. Bit flags (4 WPA, 8 WPA2, 16 enterprise),
// unlike the WiFi projection channel's WifiSecurityMode, which numbers the same names 0-9.
enum WifiSecurityMode {
  UNKNOWN_SECURITY_MODE = 0;
  OPEN = 1;
  WEP_64 = 2;
  WEP_128 = 3;
  WPA_PERSONAL = 4;
  WPA2_PERSONAL = 8;
  WPA_WPA2_PERSONAL = 12;
  WPA_ENTERPRISE = 20;
  WPA2_ENTERPRISE = 24;
  WPA_WPA2_ENTERPRISE = 28;
}
